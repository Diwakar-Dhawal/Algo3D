<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f7f3ea" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="mask-icon" href="/logo.svg" color="#b08d57" />
    <meta name="description" content="Step Java, Python, JavaScript and C++ programs through in three dimensions." />
    <title>Algo3D — DSA Visualizer</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('algo3d:theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          if (theme === 'dark') {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#15120e');
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
