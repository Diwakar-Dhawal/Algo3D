<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f7f3ea" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="mask-icon" href="/logo.svg" color="#b08d57" />
    <meta
      name="description"
      content="A free code visualiser in 3D: run Java, Python, JavaScript or C++ step by step and watch arrays, stacks, queues, lists, trees and graphs change as the code runs."
    />
    <title>Algo3D — Code Visualiser for DSA in 3D</title>
    <link rel="canonical" href="/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="Algo3D" />

    <!-- what a shared link looks like; the site is one page, so one preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Algo3D" />
    <meta property="og:title" content="Algo3D — Code Visualiser for DSA in 3D" />
    <meta
      property="og:description"
      content="Run Java, Python, JavaScript or C++ step by step and watch the data structure change in three dimensions. Free, in the browser, nothing to install."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Algo3D — Code Visualiser for DSA in 3D" />
    <meta
      name="twitter:description"
      content="Run Java, Python, JavaScript or C++ step by step and watch the data structure change in three dimensions."
    />

    <!-- the site name Google prints above a result comes from this, not the
         title: it is why a search for the brand shows "Algo3D" and not the URL -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Algo3D",
        "alternateName": ["Algo 3D", "Algo3D visualiser", "Algo3D visualizer"],
        "url": "https://algo3-d.vercel.app/"
      }
    </script>

    <!-- says what the app is, so a search result can show it as software -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Algo3D",
        "alternateName": "Algo3D code visualiser",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any web browser",
        "browserRequirements": "Requires JavaScript and WebGL",
        "description": "A code visualiser for data structures and algorithms: run Java, Python, JavaScript or C++ step by step and watch arrays, stacks, queues, linked lists, trees and graphs in 3D.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Step through code line by line",
          "3D views of arrays, stacks, queues, linked lists, trees and graphs",
          "Java, Python, JavaScript and C++ input",
          "Shareable links to a topic and step"
        ]
      }
    </script>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('algo3d:theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          if (theme === 'dark') {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#15120e');
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- crawlers that do not run the app still get a description of it -->
    <noscript>
      <main style="max-width: 42rem; margin: 3rem auto; padding: 0 1.5rem; font: 16px/1.6 system-ui, sans-serif">
        <h1>Algo3D — a code visualiser for data structures and algorithms</h1>
        <p>
          Algo3D runs Java, Python, JavaScript and C++ in the browser and shows every step in three
          dimensions: arrays and matrices as bars and grids, stacks and queues as towers, linked lists
          and trees as nodes, graphs as a force layout.
        </p>
        <p>
          Paste a program, press Run, then step forward and back through comparisons, swaps and
          assignments, with the call stack and variables beside the scene. Nothing to install, and no
          account is needed to try it.
        </p>
        <p>Algo3D needs JavaScript to draw the scene — enable it to use the visualiser.</p>

        <!-- the same words, one page per topic, for readers and crawlers that
             do not run the app: these are the pages that answer a search for a
             single structure instead of the whole product -->
        <h2>Topic guides</h2>
        <ul>
          <li><a href="/topics/arrays/">Array and sorting visualiser</a> — bubble, selection and insertion sort, linear and binary search, with the index pointers on screen.</li>
          <li><a href="/topics/matrices/">Matrix visualiser</a> — a 2D grid in 3D, spiral traversal and transpose.</li>
          <li><a href="/topics/stacks/">Stack visualiser</a> — push, pop and peek on an array-backed stack, drawn as a tower.</li>
          <li><a href="/topics/queues/">Queue visualiser</a> — enqueue at the rear, dequeue at the front, and the shifting cost.</li>
          <li><a href="/topics/linked-lists/">Linked list visualiser</a> — insert, delete and traverse nodes joined by next pointers.</li>
          <li><a href="/topics/binary-search-trees/">Binary search tree visualiser</a> — insert, search and in-order traversal, with the comparison path lit.</li>
          <li><a href="/topics/graphs/">Graph visualiser</a> — breadth-first and depth-first traversal over the same seven vertices.</li>
        </ul>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
